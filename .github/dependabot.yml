version: 2
updates:
  # Root package.json (tooling scripts; no runtime deps expected, but kept watched)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  # puppeteer-core exact pin for the drawio export skill.
  # Note: the pin is exact (no ^ range) on purpose. Dependabot PRs bump the pin
  # itself, which preserves the pinned-only version policy when merged.
  - package-ecosystem: "npm"
    directory: "/skills/awesome-drawio/scripts"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(drawio)"
    labels: ["dependencies", "skills"]
