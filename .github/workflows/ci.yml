name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: tests (linux, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Unit tests + structural verifier
        run: npm test
      - name: Cross-check audit (agents, skills, MCP, providers, pins)
        run: npm run audit
      - name: Skill smoke tests
        run: bash scripts/smoke-skills.sh
      - name: Agent/skill guide validation
        run: python3 scripts/validate-agent-guide.py
      - name: Install layout verification
        run: bash scripts/verify-install.sh

  windows:
    name: tests (windows, node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Unit tests + structural verifier
        run: npm test
